services:
  redis:
    image: redis:7-alpine
    container_name: pr-reviewer-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: pr-reviewer-postgres
    environment:
      POSTGRES_DB: prreviewer
      POSTGRES_USER: prreviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  redis-data:
  pg-data:
